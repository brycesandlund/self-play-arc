[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-selfplay"
version = "0.1.0"
description = "Differentiable task generation and retained solver learning for ARC grids"
requires-python = ">=3.11"
dependencies = ["torch==2.8.0", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "modal==1.6.1"]
report = ["matplotlib==3.11.2"]

[project.scripts]
arc-selfplay = "arcplay.train:main"

[tool.setuptools.packages.find]
include = ["arcplay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
